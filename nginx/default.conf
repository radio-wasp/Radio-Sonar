server {
    listen 80;
    client_max_body_size 5M;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream http://recorder:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";

        # ── Buffer tuning ─────────────────────────────────────────────────────
        # Larger buffers for API responses (JSON, metadata)
        proxy_buffers          16 64k;
        proxy_buffer_size      128k;
        proxy_busy_buffers_size 256k;

        # ── MP3 / large file downloads ────────────────────────────────────────
        # Disable buffering for audio files — stream directly to client
        # This eliminates the "buffered to a temporary file" warnings
        proxy_max_temp_file_size 0;

        # ── Timeouts ──────────────────────────────────────────────────────────
        proxy_read_timeout     300s;
        proxy_send_timeout     300s;
        proxy_connect_timeout  10s;
    }

    # ── Recordings: direct streaming without buffering ────────────────────────
    location /api/recordings/download/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream http://recorder:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";

        # No buffering at all for file downloads — pipe straight through
        proxy_buffering        off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout     300s;
        proxy_send_timeout     300s;
    }
}
